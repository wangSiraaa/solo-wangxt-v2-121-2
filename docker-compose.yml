services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: distill
      POSTGRES_PASSWORD: distill
      POSTGRES_DB: distillation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distill -d distillation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
